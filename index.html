<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>Мазитова | Xbox Experience</title>
    <link rel="stylesheet" href="style.css" />
    <style></style>
  </head>
  <body>
    <header>
      <div class="nav container">
        <div class="top-nav">
          <img src="./img/Group.svg" alt="Xbox logo" />
        </div>

        <div class="nav-links">
          <a href="#">Games <i class="fa fa-caret-down"></i></a>
          <a href="#">Consoles <i class="fa fa-caret-down"></i></a>
          <a href="#">Community</a>
        </div>

        <div class="search-box">
          <input type="text" placeholder="Search" />
          <button><i class="fa fa-search"></i></button>
        </div>
        <div class="my-xbox">
          <i class="fa fa-user"></i> My Xbox <i class="fa fa-caret-down"></i>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-slider">
          <div class="hero-slide active">
            <div class="hero-content container">
              <h1>Star Wars<br />Battlefront II</h1>
              <div class="hero-buttons">
                <button class="btn btn-primary">Watch Trailer</button>
                <button class="btn btn-secondary">Explore Games</button>
              </div>
            </div>
          </div>
        </div>
        <button class="slider-nav prev">
          <i class="fa fa-chevron-left"></i>
        </button>
        <button class="slider-nav next">
          <i class="fa fa-chevron-right"></i>
        </button>
      </section>

      <section class="value-section container">
        <div class="xbox-logo-center">
          <img src="./img/xbox icon.png" alt="Xbox icon" />
        </div>
        <h2 class="value-title">
          The best value<br />in games and entertainment
        </h2>
        <div class="value-cards">
          <div class="value-card">
            <div class="card-image console-image">
              <img src="./img/xbox-one-x.png" alt="Xbox One X" />
            </div>
            <div class="card-content">
              <h3>XBOX ONE X</h3>
              <p>Faster Processing<br />Smoother Gameplay</p>
              <button class="btn btn-green">
                Explore Consoles & Accessories
              </button>
            </div>
          </div>
          <div class="value-card">
            <div class="card-image mixer-logo">
              <img src="./img/mixer-logo.png" alt="Mixer logo" />
            </div>
            <div class="card-content">
              <h3>mixer Streaming</h3>
              <p>The Next Generation<br />Of Life Game Streaming</p>
              <button class="btn btn-green">Start Watching mixer</button>
            </div>
          </div>
          <div class="value-card">
            <div class="card-image gold-logo">
              <img src="./img/logo3.png" alt="Xbox Gold" />
            </div>
            <div class="card-content">
              <h3>Free Games Every Month</h3>
              <p>Get up to $700 in<br />free games</p>
              <button class="btn btn-green">Get Free Games</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
